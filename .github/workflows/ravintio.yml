name: RAVINTIO Strict Pipeline

on:
  pull_request:
    branches: [ main, master ]

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Code/Doc Parity
        run: |
          # Source folder rule (feature 0000040, ADR-003). A source folder is
          # src/, or the folder of a component.yml that product.yml lists. A
          # diff that touches a source folder must also touch a record, a file
          # under plan/ or docs/. hooks/pre-push applies the same rule. Keep
          # the two in step by hand.

          # The base commit is the merge base. Without full history, fail closed.
          if ! BASE=$(git merge-base origin/${{ github.base_ref }} HEAD 2>/dev/null); then
            echo "::error title=RAVINTIO Strict Violation::CI can't read the merge base of the base branch and HEAD. Check out with fetch-depth: 0 so the full history is present."
            exit 1
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE" HEAD)

          warn() {
            echo "::warning title=RAVINTIO source folder rule::$1"
          }

          # list_path_values: prints each path: value under components: in the
          # product.yml text on stdin. Each line starts with = so an empty value survives.
          list_path_values() {
            awk -v sq="'" '
              /^components:/ { on = 1; next }
              on && /^[^[:space:]]/ { on = 0 }
              on && /^[[:space:]]*(-[[:space:]]+)?path:/ {
                v = $0
                sub(/\r$/, "", v)
                sub(/^[[:space:]]*(-[[:space:]]+)?path:[[:space:]]*/, "", v)
                q = substr(v, 1, 1)
                if (q == "\"" || q == sq) {
                  v = substr(v, 2)
                  i = index(v, q)
                  if (i > 0) v = substr(v, 1, i - 1)
                } else {
                  sub(/[[:space:]]+#.*$/, "", v)
                  sub(/[[:space:]]+$/, "", v)
                }
                print "=" v
              }
            '
          }

          # folder_of <path>: prints the folder part of a path, or . for a root file.
          folder_of() {
            local p="$1"
            while [ "${p#./}" != "$p" ]; do p="${p#./}"; done
            case "$p" in
              */*) printf '%s\n' "${p%/*}" ;;
              *) printf '.\n' ;;
            esac
          }

          SOURCE_FOLDERS="src"
          SEEN_BLOBS=""

          # add_listed_folders <commit> <label>: adds the folders that product.yml at
          # that commit lists. An absent file adds nothing and prints nothing.
          add_listed_folders() {
            local rev="$1" label="$2" blob content value folder found=0
            if ! git cat-file -e "$rev:product.yml" 2>/dev/null; then
              return 0
            fi
            blob=$(git rev-parse "$rev:product.yml" 2>/dev/null || true)
            if [ -n "$blob" ] && grep -qxF -- "$blob" <<< "$SEEN_BLOBS"; then
              return 0
            fi
            SEEN_BLOBS="$SEEN_BLOBS
          $blob"
            if [ "$(git cat-file -t "$rev:product.yml" 2>/dev/null || true)" != "blob" ] \
              || ! content=$(git show "$rev:product.yml" 2>/dev/null); then
              warn "can't read product.yml at $label, so only src/ is checked for it."
              return 0
            fi
            while IFS= read -r value; do
              value="${value#=}"
              case "$value" in
                "")
                  warn "product.yml at $label has an empty path: value. The rule ignores it." ;;
                /*|\\*|[A-Za-z]:*)
                  warn "product.yml at $label path \"$value\" is an absolute path. The rule ignores it." ;;
                ..|../*|*/..|*/../*)
                  warn "product.yml at $label path \"$value\" has a .. part. The rule ignores it." ;;
                *)
                  folder=$(folder_of "$value")
                  SOURCE_FOLDERS="$SOURCE_FOLDERS
          $folder"
                  found=1 ;;
              esac
            done <<< "$(list_path_values <<< "$content")"
            if [ "$found" = 0 ]; then
              warn "product.yml at $label lists no components the rule can read, so only src/ is checked for it."
            fi
          }

          # Read both commits, so a branch that drops a component still has it checked.
          add_listed_folders "$BASE" "the base commit"
          add_listed_folders HEAD "HEAD"

          # Records are files under plan/ or docs/. A component.yml is source, not a record.
          HAS_RECORD=0
          TOUCHED=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              plan/*|docs/*) HAS_RECORD=1; continue ;;
            esac
            while IFS= read -r folder; do
              [ -z "$folder" ] && continue
              case "$file" in
                "$folder"/*) ;;
                *) [ "$folder" = "." ] || continue ;;
              esac
              if ! grep -qxF -- "$folder" <<< "$TOUCHED"; then
                TOUCHED="$TOUCHED
          $folder"
              fi
            done <<< "$SOURCE_FOLDERS"
          done <<< "$CHANGED_FILES"

          if [ -n "$TOUCHED" ] && [ "$HAS_RECORD" = 0 ]; then
            NAMES=""
            while IFS= read -r folder; do
              [ -z "$folder" ] && continue
              if [ "$folder" = "." ]; then
                NAMES="$NAMES the whole repository (product.yml lists a root component.yml),"
              else
                NAMES="$NAMES $folder/,"
              fi
            done <<< "$TOUCHED"
            echo "::error title=RAVINTIO Strict Violation::These source folders changed with no plan/ or docs/ file also touched in this diff:${NAMES%,}. A component.yml counts as source, not as a record. This is a presence check, not a correspondence guarantee. It does not verify that content corresponds to your change."
            exit 1
          fi
          echo "✅ RAVINTIO pipeline passed."

  # This job is specific to this repository's own self-description and is
  # deliberately NOT mirrored into ravintio-framework/hooks/ravintio.yml
  # (the copy setup.sh ships to consumer repos) — a consuming repo's README
  # doesn't have this repository's "## Repository structure" / "## The
  # framework" sections to validate against. See ADR-001 (feature 0000019).
  self-description-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify README matches repository structure
        run: node src/ravintio-framework/scripts/self-description-check.mjs .

  # The test-suite and setup-powershell jobs test this repository's own
  # framework and are deliberately NOT mirrored into
  # ravintio-framework/hooks/ravintio.yml (the copy setup.sh ships to
  # consumer repos). Consumers don't change the framework, so these tests
  # tell them nothing new. See ADR-002 (feature 0000031).
  test-suite:
    name: Test suite (${{ matrix.os }}${{ matrix.shard && format(', shard {0} of {1}', matrix.shard, matrix.shards) || '' }})
    runs-on: ${{ matrix.os }}
    # Every matrix entry sets its own per-step cap and shard count. Ubuntu runs
    # unsharded with a 15 minute cap. macOS runs two shards with a 15 minute
    # cap each. Windows runs seven shards with a 20 minute cap each, and seven
    # keeps the four slowest setup suites in separate shards. The job timeout
    # of 25 minutes is a ceiling above the largest cap. The test step carries
    # the real cap. See ADR-002 (feature 0000043) and ADR-014 (feature 0000037).
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cap: 15
          - os: macos-latest
            shard: 1
            shards: 2
            cap: 15
          - os: macos-latest
            shard: 2
            shards: 2
            cap: 15
          - os: windows-latest
            shard: 1
            shards: 7
            cap: 20
          - os: windows-latest
            shard: 2
            shards: 7
            cap: 20
          - os: windows-latest
            shard: 3
            shards: 7
            cap: 20
          - os: windows-latest
            shard: 4
            shards: 7
            cap: 20
          - os: windows-latest
            shard: 5
            shards: 7
            cap: 20
          - os: windows-latest
            shard: 6
            shards: 7
            cap: 20
          - os: windows-latest
            shard: 7
            shards: 7
            cap: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The 0000039 suites compare the tree with the commit before the
          # rename pass, so the job needs full history and origin/main.
          fetch-depth: 0

      - name: Record the test step start time
        shell: bash
        run: echo "RAVINTIO_TEST_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run the framework test suite
        shell: bash
        timeout-minutes: ${{ matrix.cap }}
        env:
          RAVINTIO_SHARD_INDEX: ${{ matrix.shard }}
          RAVINTIO_SHARD_COUNT: ${{ matrix.shards || '' }}
        run: bash src/ravintio-framework/tests/run-tests.sh

      - name: Report the test step time
        if: always()
        shell: bash
        env:
          CAP: ${{ matrix.cap }}
        run: |
          start="${RAVINTIO_TEST_START:-}"
          cap="${CAP:-}"
          case "$start" in ''|*[!0-9]*) echo "Elapsed: unknown"; exit 0 ;; esac
          case "$cap" in ''|*[!0-9]*) echo "Elapsed: unknown"; exit 0 ;; esac
          now="$(date +%s)"
          elapsed=$((now - start))
          msg="$((elapsed / 60)) min $((elapsed % 60)) s of a ${cap} min cap"
          echo "Elapsed: ${msg}"
          if [ "$elapsed" -gt $((cap * 40)) ]; then
            echo "::warning title=Test job margin::${msg}"
          fi
          exit 0

  setup-powershell:
    name: Setup under PowerShell 7 (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check the PowerShell version
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          if ($PSVersionTable.PSVersion.Major -lt 7) {
            Write-Error "PowerShell 7 or later is required."
            exit 1
          }

      - name: Run test_setup.ps1
        shell: pwsh
        run: ./src/ravintio-framework/tests/test_setup.ps1

  # This job is repository-only and deliberately NOT mirrored into
  # ravintio-framework/hooks/ravintio.yml. It runs test_setup.ps1 under
  # Windows PowerShell 5.1, the default shell on a stock Windows machine.
  # See ADR-012 (feature 0000037), which amends ADR-001 (feature 0000031).
  setup-powershell-51:
    name: Setup under Windows PowerShell 5.1
    runs-on: windows-latest
    # The cap stays at 10 (0000039 X-001). The req-006 step runs only the
    # .ps1 pass, which took about 2 minutes under pwsh on windows-latest.
    # The req-004 step (0000040) also runs only the .ps1 pass. It took about
    # 77 seconds on macOS, and 0000037 req-011 pins this cap at 10.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check the PowerShell version
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            Write-Error "Windows PowerShell 5 is required."
            exit 1
          }

      - name: Run test_setup.ps1
        shell: powershell
        run: ./src/ravintio-framework/tests/test_setup.ps1

      # 0000039 req-006 AC4 (X-001): the migration helper must parse and
      # match the .sh helper under Windows PowerShell 5.1 as well as 7.
      - name: Parse the migration helper under 5.1
        shell: powershell
        run: |
          $path = Join-Path $PWD 'src\ravintio-framework\migrations\migrate-0.37.0-ravintio-rename.ps1'
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            foreach ($e in $errors) { Write-Host "Line $($e.Extent.StartLineNumber): $($e.Message)" }
            Write-Host "The helper has $($errors.Count) parse errors under $($PSVersionTable.PSVersion)."
            exit 1
          }
          Write-Host "The helper parses under $($PSVersionTable.PSVersion)."

      # Git Bash runs the suite. The .ps1 cases call powershell.exe, which
      # is Windows PowerShell 5.1. The .sh pass already runs in test-suite.
      - name: Run the req-006 .ps1 cases under 5.1
        shell: bash
        env:
          RAVINTIO_TEST_PWSH: powershell.exe
          RAVINTIO_TEST_REQ006_ONLY: ps1
        run: |
          major=$(powershell.exe -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.Major' | tr -d '\r')
          if [ "$major" != 5 ]; then
            echo "powershell.exe reports major version $major, not 5."
            exit 1
          fi
          bash src/ravintio-framework/tests/test-0000039-req-006-consumer-migration.sh

      # 0000040 req-004 AC3: setup.ps1 removes the retired track files under
      # Windows PowerShell 5.1 as well as 7. The .sh runs happen in test-suite.
      - name: Run the req-004 .ps1 cases under 5.1
        shell: bash
        env:
          RAVINTIO_TEST_PWSH: powershell.exe
          RAVINTIO_TEST_REQ004_ONLY: ps1
        run: |
          major=$(powershell.exe -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.Major' | tr -d '\r')
          if [ "$major" != 5 ]; then
            echo "powershell.exe reports major version $major, not 5."
            exit 1
          fi
          bash src/ravintio-framework/tests/test-0000040-req-004-remove-track-files.sh

  # The release-copy-integrity job is repo-only. It is deliberately NOT
  # mirrored into src/ravintio-framework/hooks/ravintio.yml (the copy setup.sh
  # ships to consumer repos), because consumers have no source pack to compare
  # their copy with. It checks the root copy against its release.yml. A root
  # copy with no release.yml is a release from before 0.39.0, so the job
  # reports a skip. See ADR-009 (feature 0000041).
  release-copy-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify the root copy matches its release.yml
        run: |
          rc=0
          out=$(node src/ravintio-framework/scripts/release-check.mjs --root . --files-only 2>&1) || rc=$?
          if [ "$rc" -eq 0 ] && [[ "$out" == *"skipped: no ravintio-framework/release.yml"* ]]; then
            echo "::notice title=Release copy integrity::Skipped. The root copy has no release.yml, so it is a release from before 0.39.0."
            exit 0
          fi
          printf '%s\n' "$out"
          if [ "$rc" -eq 1 ]; then
            echo "::error title=Release copy integrity::The root copy differs from release.yml. The lines above name each file."
          elif [ "$rc" -ne 0 ]; then
            echo "::error title=Release copy integrity::release-check.mjs could not check the copy (exit $rc). See the reason above."
          fi
          exit "$rc"
